<div class="container mt-4">
  <h3>{{ subDeptId() ? 'Edit Sub-Department' : 'Create Sub-Department' }}</h3>

  <div *ngIf="backendErrors()" class="alert alert-danger">
    <ul class="mb-0">
      <li *ngFor="let error of backendErrors()">{{ error }}</li>
    </ul>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="saveSubDepartment()">
    <div class="mb-3">
      <label for="name" class="form-label">Sub-Department Name</label>
      <input 
        type="text" 
        class="form-control" 
        id="name" 
        formControlName="name"
        [class.is-invalid]="formGroup.get('name')?.touched && formGroup.get('name')?.invalid"
      />
      <div *ngIf="formGroup.get('name')?.touched && formGroup.get('name')?.hasError('required')" class="invalid-feedback">
        Sub-Department name is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <select 
        class="form-select" 
        id="department" 
        formControlName="departmentId"
        [class.is-invalid]="formGroup.get('departmentId')?.touched && formGroup.get('departmentId')?.invalid"
      >
        <option [ngValue]="null">-- Select Department --</option>
        <option *ngFor="let dept of departmentsFromApi()" [ngValue]="dept.id">
          {{ dept.name }}
        </option>
      </select>
      <div *ngIf="formGroup.get('departmentId')?.touched && formGroup.get('departmentId')?.hasError('required')" class="invalid-feedback">
        Department is required.
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" class="btn btn-secondary mx-2" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
