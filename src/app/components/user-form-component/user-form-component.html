<div class="container mt-4">
  <h3>{{ userId() ? 'Edit User' : 'Create User' }}</h3>

  <div *ngIf="backendErrors()" class="alert alert-danger">
    <ul class="mb-0">
      <li *ngFor="let error of backendErrors()">{{ error }}</li>
    </ul>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="saveUser()">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input 
        type="text" 
        class="form-control" 
        id="name" 
        formControlName="name" 
        [class.is-invalid]="formGroup.get('name')?.touched && formGroup.get('name')?.invalid"
      />
      <div *ngIf="formGroup.get('name')?.touched && formGroup.get('name')?.hasError('required')" class="invalid-feedback">
        Name is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <input 
        type="number" 
        class="form-control" 
        id="age" 
        formControlName="age"
        [class.is-invalid]="formGroup.get('age')?.touched && formGroup.get('age')?.invalid"
      />
      <div *ngIf="formGroup.get('age')?.touched && formGroup.get('age')?.hasError('required')" class="invalid-feedback">
        Age is required.
      </div>
      <div *ngIf="formGroup.get('age')?.touched && formGroup.get('age')?.hasError('min')" class="invalid-feedback">
        Age must be at least 1.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input 
        type="email" 
        class="form-control" 
        id="email" 
        formControlName="email"
        [class.is-invalid]="formGroup.get('email')?.touched && formGroup.get('email')?.invalid"
      />
      <div *ngIf="formGroup.get('email')?.touched && formGroup.get('email')?.hasError('required')" class="invalid-feedback">
        Email is required.
      </div>
      <div *ngIf="formGroup.get('email')?.touched && formGroup.get('email')?.hasError('email')" class="invalid-feedback">
        Invalid email format.
      </div>
    </div>

    <div class="mb-3">
      <label for="subDepartment" class="form-label">Sub-Department</label>
      <select 
        class="form-select" 
        id="subDepartment" 
        formControlName="subDepartmentId"
        [class.is-invalid]="formGroup.get('subDepartmentId')?.touched && formGroup.get('subDepartmentId')?.invalid"
      >
        <option [ngValue]="null">-- Select Sub-Department --</option>
        <option *ngFor="let sd of subDepartmentsFromApi()" [ngValue]="sd.id">
          {{ sd.name }}
        </option>
      </select>
      <div *ngIf="formGroup.get('subDepartmentId')?.touched && formGroup.get('subDepartmentId')?.hasError('required')" class="invalid-feedback">
        Sub-Department is required.
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" class="btn btn-secondary mx-2" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
