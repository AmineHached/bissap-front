<div class="container mt-4">
  <mat-card>
    <mat-card-header>
      {{ departmentId() ? 'Edit Department' : 'Create Department' }}
    </mat-card-header>

    <mat-card-content>
      <form class="mt-2" [formGroup]="formGroup" (ngSubmit)="saveDepartment()">
        <mat-form-field class="mx-1" appearance="fill">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required />
        </mat-form-field>

        <br />

        <button type="submit" mat-raised-button color="primary">Save</button>
      </form>

      <div class="d-flex mt-2">
        @if (formGroup.get('name')?.touched && formGroup.get('name')?.hasError('required')) {
        <div class="alert alert-danger w-25 mx-1">
          <span>Name is required</span>
        </div>
        }
      </div>
      @if (backendErrors()) {

      <div class="alert alert-danger w-50 mt-2">
        {{ backendErrors() }}
      </div>
      }
    </mat-card-content>
  </mat-card>
</div>
