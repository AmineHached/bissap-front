<div class="container mt-4">
  <h3>Sub-Departments</h3>
  <div class="d-flex justify-content-end align-items-end mb-2">
    <button (click)="createSubDepartment()" class="btn btn-primary">Create new</button>
  </div>

  <table class="table mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sd of subDepartmentsFromApi()">
        <td>{{ sd.id }}</td>
        <td>{{ sd.name }}</td>
        <td>{{ sd.department?.name || 'N/A' }}</td>
        <td>
          <button class="btn btn-sm btn-warning mx-1" (click)="editSubDepartmentFromApi(sd.id)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="removeSubDepartmentFromApi(sd.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="subDepartmentsFromApi().length === 0" class="alert alert-info">
    No sub-departments found.
  </div>
</div>
