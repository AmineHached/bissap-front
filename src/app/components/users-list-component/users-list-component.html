<div class="container mt-4">
  <h3>Users</h3>
  <div class="d-flex justify-content-end align-items-end mb-2">
    <button (click)="openCreateUser()" class="btn btn-primary">
        Create new</button>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Sub-Department</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of usersFromApi()">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.age }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.subDepartment?.name || 'N/A' }}</td>
        <td>
          <button 
            class="btn btn-sm btn-warning mx-1" 
            (click)="openEditUser(user.id)">Edit</button>
          <button 
            class="btn btn-sm btn-danger" 
            (click)="removeUserFromApi(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="usersFromApi().length === 0" class="alert alert-info">
    No users found.
  </div>
</div>
